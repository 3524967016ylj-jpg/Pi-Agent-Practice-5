<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="890" viewBox="0 0 1220 890"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#317db7"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183153}.head{font-size:17px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#49657c}.lane{stroke:#a9bfd0;stroke-dasharray:5 5}.arrow{stroke:#317db7;stroke-width:2;marker-end:url(#a)}</style><rect width="100%" height="100%" fill="#fff"/><rect x="17" y="25" width="186" height="45" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="110.0" y="52.5" class="label" text-anchor="middle">用户</text><line x1="110" y1="70" x2="110" y2="870" class="lane"/><rect x="267" y="25" width="186" height="45" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="360.0" y="52.5" class="label" text-anchor="middle">交互与会话层</text><line x1="360" y1="70" x2="360" y2="870" class="lane"/><rect x="517" y="25" width="186" height="45" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="610.0" y="52.5" class="label" text-anchor="middle">Agent 执行层</text><line x1="610" y1="70" x2="610" y2="870" class="lane"/><rect x="767" y="25" width="186" height="45" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="860.0" y="52.5" class="label" text-anchor="middle">模型请求层</text><line x1="860" y1="70" x2="860" y2="870" class="lane"/><rect x="1017" y="25" width="186" height="45" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="1110.0" y="52.5" class="label" text-anchor="middle">read 工具</text><line x1="1110" y1="70" x2="1110" y2="870" class="lane"/><line x1="110" y1="105" x2="360" y2="105" class="arrow"/><text x="235.0" y="96" class="small" text-anchor="middle">onSubmit：提交提问</text><line x1="360" y1="171" x2="610" y2="171" class="arrow"/><text x="485.0" y="162" class="small" text-anchor="middle">AgentSession.prompt() → Agent.prompt()</text><line x1="610" y1="237" x2="860" y2="237" class="arrow"/><text x="735.0" y="228" class="small" text-anchor="middle">streamAssistantResponse() / streamFunction()</text><line x1="860" y1="303" x2="610" y2="303" class="arrow"/><text x="735.0" y="294" class="small" text-anchor="middle">远端模型返回 read 调用</text><line x1="610" y1="369" x2="1110" y2="369" class="arrow"/><text x="860.0" y="360" class="small" text-anchor="middle">executeToolCalls() → read.execute()</text><path d="M1110,435 h65 v25 h-65" fill="none" class="arrow"/><text x="1180" y="426" class="small" text-anchor="middle">resolveReadPathAsync()；createReadStream()</text><line x1="1110" y1="501" x2="610" y2="501" class="arrow"/><text x="860.0" y="492" class="small" text-anchor="middle">toolResult：交接单文本</text><line x1="610" y1="567" x2="860" y2="567" class="arrow"/><text x="735.0" y="558" class="small" text-anchor="middle">带工具结果再次请求模型</text><line x1="860" y1="633" x2="610" y2="633" class="arrow"/><text x="735.0" y="624" class="small" text-anchor="middle">远端模型返回最终答复</text><line x1="610" y1="699" x2="360" y2="699" class="arrow"/><text x="485.0" y="690" class="small" text-anchor="middle">message_update / message_end</text><line x1="360" y1="765" x2="110" y2="765" class="arrow"/><text x="235.0" y="756" class="small" text-anchor="middle">更新 streamingComponent，显示回复</text><text x="600" y="853" class="small" text-anchor="middle">同一用户输入内：模型调用 → 工具执行 → 带结果再次调用模型；消息经 SessionManager.appendMessage() 保存</text></svg>