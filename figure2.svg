<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="685" viewBox="0 0 1320 685"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#317db7"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183153}.head{font-size:17px;font-weight:700}.label{font-size:14px}.small{font-size:12px;fill:#49657c}.lane{stroke:#a9bfd0;stroke-dasharray:5 5}.arrow{stroke:#317db7;stroke-width:2;marker-end:url(#a)}</style><rect width="100%" height="100%" fill="#fff"/><text x="650" y="35" class="head" text-anchor="middle">A 阶段结束：Pi 已读到并回答完整启动命令</text><text x="330" y="88" class="head" text-anchor="middle">旧会话恢复</text><text x="970" y="88" class="head" text-anchor="middle">新会话</text><rect x="60" y="110" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="340.0" y="142.5" class="label" text-anchor="middle">退出后 -c 重新启动</text><rect x="60" y="203" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="340.0" y="235.5" class="label" text-anchor="middle">continueRecent() 查找最近 JSONL</text><line x1="340" y1="165" x2="340" y2="203" class="arrow"/><rect x="60" y="296" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="340.0" y="328.5" class="label" text-anchor="middle">loadEntriesFromFile() 恢复历史</text><line x1="340" y1="258" x2="340" y2="296" class="arrow"/><rect x="60" y="389" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="340.0" y="421.5" class="label" text-anchor="middle">输入相同的 README 提问</text><line x1="340" y1="351" x2="340" y2="389" class="arrow"/><rect x="60" y="482" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="340.0" y="514.5" class="label" text-anchor="middle">历史消息 + 本次提问请求模型</text><line x1="340" y1="444" x2="340" y2="482" class="arrow"/><rect x="60" y="575" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="340.0" y="607.5" class="label" text-anchor="middle">答出 cedar-428；无工具事件</text><line x1="340" y1="537" x2="340" y2="575" class="arrow"/><rect x="700" y="110" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="980.0" y="142.5" class="label" text-anchor="middle">输入 /new</text><rect x="700" y="203" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="980.0" y="235.5" class="label" text-anchor="middle">AgentSessionRuntime.newSession()</text><line x1="980" y1="165" x2="980" y2="203" class="arrow"/><rect x="700" y="296" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="980.0" y="328.5" class="label" text-anchor="middle">新会话历史为空</text><line x1="980" y1="258" x2="980" y2="296" class="arrow"/><rect x="700" y="389" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="980.0" y="421.5" class="label" text-anchor="middle">输入完全相同的提问</text><line x1="980" y1="351" x2="980" y2="389" class="arrow"/><rect x="700" y="482" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="980.0" y="514.5" class="label" text-anchor="middle">仅本次提问进入新历史</text><line x1="980" y1="444" x2="980" y2="482" class="arrow"/><rect x="700" y="575" width="560" height="55" rx="9" fill="#eaf4fc" stroke="#83b5d7"/><text x="980.0" y="607.5" class="label" text-anchor="middle">表示缺少命令；无工具事件</text><line x1="980" y1="537" x2="980" y2="575" class="arrow"/></svg>